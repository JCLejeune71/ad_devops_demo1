apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-backend
  namespace: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-backend
  template:
    metadata:
      labels:
        app: api-backend
    spec:
      containers:
        - name: api
          image: demo-backend:v1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: APP_VERSION
              value: "v1.0"
            - name: DEPLOYED_BY
              value: "manual"
---
apiVersion: v1
kind: Service
metadata:
  name: api-backend
  namespace: demo-app
spec:
  type: ClusterIP
  selector:
    app: api-backend
  ports:
    - port: 8000
      targetPort: 8000
